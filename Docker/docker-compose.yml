services:
    skelseg-dev:
        container_name: skelseg-dev
        build:
            context: ..
            dockerfile: Docker/Dockerfile
            args:
                USER_UID: ${USER_UID:-1000}
                USER_GID: ${USER_GID:-1000}

        # Keep container running for interactive use
        stdin_open: true
        tty: true

        # Network and IPC
        network_mode: host
        ipc: host

        # Debugging support
        cap_add:
            - SYS_PTRACE
        security_opt:
            - seccomp:unconfined
            - apparmor:unconfined

        environment:
            PYTHONUNBUFFERED: 1
            # X11
            DISPLAY: ${DISPLAY:-:0}
            XAUTHORITY: /tmp/.docker.xauth
            # Wayland
            WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
            # Container's runtime dir is keyed off the dev user's UID.
            XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
            # Audio
            PULSE_SERVER: ${PULSE_SERVER:-unix:/run/user/${USER_UID:-1000}/pulse/native}
            # Software rendering (set 0 for GPU acceleration)
            LIBGL_ALWAYS_SOFTWARE: 1

        volumes:
            - ..:/workspace
            # X11 socket and auth
            - /tmp/.X11-unix:/tmp/.X11-unix:rw
            - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
            # WSLg (safe to include on native Linux, but not on MacOS)
            # - /mnt/wslg:/mnt/wslg
            # User runtime (audio, D-Bus, etc.)
            - ${XDG_RUNTIME_DIR:-/run/user/1000}:/run/user/${USER_UID:-1000}

        working_dir: /workspace
